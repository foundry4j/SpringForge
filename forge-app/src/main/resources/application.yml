spring:
    application:
        name: spring-forge
    threads:
        virtual:
            enabled: true
    datasource:
        url: jdbc:h2:mem:forge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
        driver-class-name: org.h2.Driver
        username: sa
        password: ""
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate.jdbc.time_zone: UTC
    flyway:
        enabled: true
    quartz:
        job-store-type: memory
        properties:
            org.quartz.threadPool.threadCount: 4
            org.quartz.jobStore.misfireThreshold: 60000

forge:
    context:
        default-tenant: default
    cache:
        provider: local
        local-ttl: 30s
        local-max-size: 10000
    lock:
        provider: local
        wait-time: 2s
        lease-time: 30s
    messaging:
        enabled: false
    outbox:
        poll-interval: 1s
        batch-size: 50
    scheduling:
        group: forge

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health,info

logging:
    level:
        io.github.foundry4j.forge: INFO
